[package]
name = "lwip"
version = "0.3.15"
edition = "2021"
description = "Rust bindings for the lwIP TCP/IP stack"
license = "MIT/Apache-2.0"
authors = ["@ssrlive"]
documentation = "https://docs.rs/lwip"
homepage = "https://github.com/ssrlive/lwip"
readme = "README.md"
rust-version = "1.70.0"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["lib", "cdylib"]
path = "rust/lib.rs"

[dependencies]
bytes = "1"
futures = "0.3"
log = "0.4"
thiserror = "1"
tokio = { version = "1", features = [
  "sync",
  "io-util",
  "macros",
  "net",
  "time",
  "rt",
  "rt-multi-thread",
] }
# PollSender: waker-correct bounded-channel Sink used by the TcpStream write
# path and the NetStack ingress Sink. The `sync` module is unconditional.
tokio-util = { version = "0.7", default-features = false }

[build-dependencies]
bindgen = "0.69"
cc = "1.0"
